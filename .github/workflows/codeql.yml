name: codeql

# GitHub's code scanning over the Python backend, the TypeScript of the client and the shell, and
# these workflows themselves. GitHub stores the results for a public repository; a private one on
# the free plan cannot, so there the job is skipped by the repository's visibility.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"

# Each job states the permissions it needs, and the workflow grants none by default.
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
