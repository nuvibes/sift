name: codeql

# GitHub's code scanning over the Python backend, the TypeScript of the client and the shell, and
# these workflows themselves. GitHub stores the results for a public repository; a private one on
# the free plan cannot, so there the job is skipped by the repository's visibility.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"

# Each job states the permissions it needs, and the workflow grants none by default.
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # A new error-level alert fails the run: open on this ref and, on a pull request, not already open
  # on the default branch. Read once every analysis has landed (`analyze` waits for its processing).
  alerts:
    if: ${{ !github.event.repository.private }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: read
    steps:
      - name: No new error-level alert
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          BASE: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          open_on() {
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&severity=error&per_page=100&ref=$1" \
              --jq '.[] | [.number, .rule.id, "\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)", .html_url] | @tsv'
          }
          open_on "$REF" > here.tsv
          : > base.tsv
          if [ "$REF" != "$BASE" ]; then
            open_on "$BASE" > base.tsv
          fi
          new="$(awk -F '\t' 'FILENAME == ARGV[1] { seen[$1] = 1; next } !($1 in seen)' base.tsv here.tsv)"
          if [ -n "$new" ]; then
            echo "::error::A new error-level CodeQL alert is open on $REF:"
            printf '%s\n' "$new"
            exit 1
          fi
          echo "No new error-level alert on $REF."
