name: docs

# The docs site (docs-site/), on every push and pull request: its generated pages diffed against
# what they describe, its gates (scripts/check_docs.py: Vale, the settings paths, the links and
# their headings, a page for every rail destination and settings pane, the menu labels a page still
# owes), then the build. A push to main hands the build to GitHub Pages when the repository is
# public and its Pages site is published from a workflow; anywhere else the build and its checks
# run all the same and the deploy is skipped with a notice.
#
# Actions are pinned to commit SHAs, not tags, as in quick.yml; the comment names the tag.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each job states the permissions it needs, and the workflow grants none by default.
permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version and digest scripts/check_docs.py and the pre-commit hook expect.
  VALE_VERSION: "3.24.0"
  VALE_SHA256: "867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: ./.github/actions/node
        with:
          workspace: docs-site

      - name: Vale, at the pinned version
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSfLO "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$archive" -C "$RUNNER_TEMP/vale" vale
          echo "DOCS_VALE=$RUNNER_TEMP/vale/vale" >> "$GITHUB_ENV"

      - name: The generated pages match what they describe, and every docs gate holds
        run: uv run python scripts/check_docs.py

      - name: Build
        working-directory: docs-site
        env:
          SIFT_DOCS_SITE: https://${{ github.repository_owner }}.github.io
          SIFT_DOCS_BASE: /${{ github.event.repository.name }}
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build

      # The Pages site answers only once it is published, and only a site published from a workflow
      # takes a deployment from one; asked here, so a push never fails for want of either. A run
      # started by hand on main deploys too; a pull request only builds.
      - name: Whether Pages takes this build
        id: pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" = "true" ]; then
            echo "::notice::The repository is private: the docs site is built, not deployed."
            exit 0
          fi
          source="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$source" != "workflow" ]; then
            echo "::notice::Pages is not published from a workflow here: the site is built, not deployed."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Hand the build to Pages
        if: ${{ steps.pages.outputs.deploy == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    needs: build
    if: ${{ needs.build.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
