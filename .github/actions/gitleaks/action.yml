name: gitleaks
description: The pinned gitleaks binary on PATH, verified against its published checksum before it is trusted.

# A checksum-verified binary rather than the published container action: that action carries its
# own gitleaks at whatever version its image was built with, it cannot run on Windows, and the
# scanner must not be an unverified download running with this repository's token.
#
# The pin lives here, as the inputs' defaults, and nowhere else in `.github`: every workflow uses
# the action without overriding it. tests/gates/test_versions.py holds the version to the one in
# .pre-commit-config.yaml, so CI and the local hook scan with the same rules.
#
# PowerShell on Windows rather than curl-and-unzip in bash: `Invoke-WebRequest`, `Get-FileHash`
# and `Expand-Archive` are part of the shell, whatever msys packages a runner's Git carries. Windows
# PowerShell (`powershell`) and not PowerShell 7 (`pwsh`), because every Windows machine has the
# first and not every one has the second.

# Bump all three together, from the release's published checksums.
inputs:
  version:
    description: The gitleaks release to install, without the leading v.
    default: "8.21.2"
  sha256-linux:
    description: SHA-256 of gitleaks_<version>_linux_x64.tar.gz, from the published checksums.
    default: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
  sha256-windows:
    description: SHA-256 of gitleaks_<version>_windows_x64.zip, from the published checksums.
    default: "f238c85e5f47e18fac779ce71ee11091cf70a0a8fb4415f165efba2800eef133"

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256-linux }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        curl -sSL -o "$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
        echo "${SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
        sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
        gitleaks version

    - if: runner.os == 'Windows'
      # Windows PowerShell with its policy named: a runner account's default policy refuses a script
      # file, and naming it keeps the step independent of the machine's setting.
      shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256-windows }}
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
        $name = "gitleaks_${env:VERSION}_windows_x64.zip"
        $zip = Join-Path $env:RUNNER_TEMP $name
        Invoke-WebRequest -UseBasicParsing -OutFile $zip `
          -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$($env:VERSION)/$name"

        # Before extraction, not after. An archive is trusted the moment it is unpacked, so the
        # comparison has to stand between the download and everything that reads it.
        $got = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
        if ($got -ne $env:SHA256.ToLower()) {
          throw "gitleaks $($env:VERSION) checksum is $got, expected $($env:SHA256)"
        }

        $dir = Join-Path $env:RUNNER_TEMP 'gitleaks'
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        Add-Content -Path $env:GITHUB_PATH -Value $dir
        & (Join-Path $dir 'gitleaks.exe') version
