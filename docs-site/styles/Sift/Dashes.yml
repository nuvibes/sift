# Two hyphens are never a dash in Sift, and the tree is ASCII, so there is no em dash either:
# Apple's em dash (dash (em)) becomes two sentences or a colon.
extends: existence
message: "Rewrite '%s' as two sentences or with a colon; Sift writes no dashes between words."
level: error
nonword: true
raw:
  - '\s--\s|\x{2014}|\s\x{2013}\s'
