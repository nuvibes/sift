# Vale for Sift's docs. The rules are in styles/Sift, each naming its source in its own header; the
# three that hold Sift's words (ScreenWords, ScreenWordsCase, Headings) are generated from
# tests/gates/data/vocabulary.json by scripts/docs_generate.py and never edited by hand.
StylesPath = styles
MinAlertLevel = suggestion

# Code is not prose: a key or a command is left alone. A settings path is a plain link, and
# scripts/check_docs.py holds how it is written, because Vale never sees a link's address.
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

[*.md]
BasedOnStyles = Sift
# A settings path is the screen's own labels, quoted as the search takes them (scripts/docs_paths.py),
# so Vale reads it no more than it read it in code ticks.
TokenIgnores = (\{\{discord\}\}), (Settings >[^\]\n]*)

# The settings pages are generated: each row is the registry's copy, in the screen's words ("this
# device" among them). Their written openings are read on their own, under openings/.
[src/content/docs/settings/*.md]
Sift.SecondPerson = NO

# What's new is CHANGELOG.md, the one page that says what changed and when; its lines are held
# by the changelog's own gates when they are written.
[src/content/docs/whats-new.md]
BasedOnStyles =

# The API reference names routes and their summaries as the server declares them.
[src/content/docs/developers/api.md]
BasedOnStyles =
