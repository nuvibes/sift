; Coverage settings for the package modules alone: the four `__init__.py` files.
;
; Every other coverage gate names a package or a module and coverage measures it. These cannot:
; naming `sift` measures the whole tree, and coverage's source setting takes a package or a
; directory rather than a single file. An include pattern is what narrows it to a list of files,
; and an include is only honoured when no source is set, which is why this file exists instead of
; another flag on the command line.
;
; Three of the four hold nothing but re-exports and one holds nothing at all, so the number is
; never in doubt. They are gated anyway, for the same reason the empty ones exist: the day somebody
; puts a branch in one of them, it is measured from the first line rather than from whenever anyone
; notices. `sift/kernel/content/__init__.py` is the one with real content: a hundred-odd lines of
; re-export that every feature imports through.
;
; The report settings mirror the ones in pyproject.toml, because a config file replaces them rather
; than adding to them.
[run]
include =
    src/sift/__init__.py
    src/sift/kernel/__init__.py
    src/sift/kernel/content/__init__.py
    src/sift/slices/__init__.py
branch = true

[report]
exclude_also =
    if TYPE_CHECKING:
    raise NotImplementedError
    @overload
    if __name__ == "__main__":
